[project]
name = "sxpb_llm_benchmark"
version = "0.0.0"
authors = [
]
dependencies = [
    "huggingface-hub>=0.20.3",
    "llama-cpp-python>=0.3.16",
    "openai>=1.0.0",
    "psutil>=5.9.8",
    "pyyaml>=6.0.3",
    "sxpb @ git+https://github.com/sxproto/sxpb-py@4a2ce27ba7863a22ca298b9e32cfa54f2fe6716b",
    "toon-format @ git+https://github.com/toon-format/toon-python.git",
]
requires-python = ">=3.9"

[build-system]
requires = ["pdm-pep517>=1.0.0"]
build-backend = "pdm.pep517.api"

[tool.pdm.dev-dependencies]
dev = [
    "pytest",
    "ruff",
    "ty",
    "faker",
]

[tool.pytest.ini_options]
addopts = "--showlocals"
pythonpath = ["."]


[tool.pdm.scripts]
benchmark = "python -m src.run_benchmark"
q2a = "python -m src.q2a"
toon-benchmark = "python -m src.bench.toon.run_benchmark"
check-format = "ruff check"
check-type = "ty check"
tidy = "ruff format"
lint = {composite = ["check-format", "check-type"]}
test = "pytest"
